<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Book Your Tour | New York Pedicab Experience</title>
  <meta http-equiv="refresh" content="0;url=https://book.squareup.com/appointments/omkc9dazx6zdyd/location/D7W3JJADBMXR7/services">
  <style>
    :root{--navy:#06192d;--navy2:#0b2945;--gold:#ffc84d;--cream:#fbf5e9;--white:#fff;--ink:#10202f;--muted:#607080}
    *{box-sizing:border-box}body{margin:0;font-family:Arial,Helvetica,sans-serif;color:var(--ink);background:linear-gradient(145deg,#f8f1e4,#fff 55%)}
    a{color:inherit;text-decoration:none}.wrap{max-width:1080px;margin:auto;padding:0 20px}
    header{background:var(--navy);color:white;padding:16px 0;border-bottom:3px solid var(--gold)}
    nav{display:flex;align-items:center;justify-content:space-between;gap:20px}nav img{width:210px;height:60px;object-fit:contain;background:#faf6ed;border-radius:9px}
    .back{font-weight:800;color:var(--gold)}main{padding:48px 0 70px}.intro{text-align:center;margin-bottom:28px}.intro h1{font:700 clamp(38px,6vw,62px) Georgia,serif;color:var(--navy);margin:0 0 10px}.intro p{color:var(--muted);font-size:18px}
    .panel{display:grid;grid-template-columns:1.2fr .8fr;background:white;border-radius:24px;overflow:hidden;box-shadow:0 18px 55px rgba(6,25,45,.14);border:1px solid #eadbbf}
    .form{padding:34px}.summary{padding:34px;background:var(--navy);color:white}.summary h2{font-family:Georgia,serif;color:var(--gold);margin-top:0}
    label{display:block;font-weight:900;margin:0 0 8px}.field{margin-bottom:22px}select,input{width:100%;padding:15px;border:1px solid #cbd3da;border-radius:12px;background:white;font-size:16px}
    .stepper{display:flex;align-items:center;justify-content:space-between;border:1px solid #cbd3da;border-radius:12px;padding:8px}.stepper button{width:48px;height:44px;border:0;border-radius:10px;background:var(--navy);color:white;font-size:25px;font-weight:900}.stepper output{font-size:23px;font-weight:900}
    .times{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.time{border:1px solid #b8c2cb;background:white;border-radius:10px;padding:11px 6px;font-weight:800}.time.active{background:var(--navy);color:white;border-color:var(--navy)}
    .book{width:100%;border:0;background:var(--gold);color:var(--navy);font-weight:900;font-size:17px;padding:16px;border-radius:13px;cursor:pointer}.book:disabled{opacity:.55;cursor:not-allowed}
    .line{display:flex;justify-content:space-between;gap:15px;padding:14px 0;border-bottom:1px solid rgba(255,255,255,.18)}.total{font-size:27px;font-weight:900;color:var(--gold)}
    .note{margin-top:22px;font-size:13px;line-height:1.5;color:#c9d5df}.status{min-height:22px;margin-top:14px;font-weight:700;color:#8f6300}
    @media(max-width:760px){.panel{grid-template-columns:1fr}.form,.summary{padding:24px}.times{grid-template-columns:repeat(2,1fr)}nav img{width:165px}.back{font-size:13px}}
  </style>
</head>
<body>
  <header><div class="wrap"><nav><a href="index.html"><img src="logo.svg" alt="New York Pedicab Experience"></a><a class="back" href="tours.html">← BACK TO TOURS</a></nav></div></header>
  <main><div class="wrap">
    <div class="intro"><h1>Book Your Pedicab Tour</h1><p>Opening our secure Square booking page…</p><a class="book" href="https://book.squareup.com/appointments/omkc9dazx6zdyd/location/D7W3JJADBMXR7/services">CONTINUE TO SQUARE BOOKING</a></div>
  </div></main>
</body>
</html>
